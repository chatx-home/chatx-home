<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>צ'אט</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{
      --bg:#ffffff; --panel:#F8FAFD; --border:#DDE3EA; --border-soft:#E9EDF2;
      --text:#1F2430; --text-dim:#5F6B7A; --text-faint:#98A1AF;
      --hover:#EDF1F7; --active:#DDE8FA;
      --dm:#0B57D0; --dm-bg:#D3E3FD; --dm-soft:#E8F0FE;
      --group:#DB6E12; --group-bg:#FBEEE0; --space:#7C3AED; --space-bg:#F1EBFC;
      --danger:#D93025; --ok:#1E8E3E;
      --radius:14px; --shadow:0 8px 28px rgba(20,25,40,.14); --shadow-sm:0 2px 10px rgba(20,25,40,.10);
      --gchip:#F1F3F4; --gicon:#5F6368;
      --bubble-own:#D3E3FD; --bubble-other:#F0F1F3; --bubble-text:#1F2430;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{margin:0;font-family:'Rubik',Arial,sans-serif;color:var(--text);background:var(--bg);direction:rtl;overflow:hidden;}
    button{font-family:inherit;}
    input,textarea{font-family:inherit;}
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-thumb{background:#D6DAE2;border-radius:8px;}
    ::-webkit-scrollbar-thumb:hover{background:#C1C7D1;}
    @keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
    @keyframes flashBg{0%{background:var(--dm-bg);}100%{background:transparent;}}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

    /* ---------- Login ---------- */
    #loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;
      background:linear-gradient(160deg,#EAF1FD 0%,#EFEFFC 50%,#FDF3EC 100%);overflow:hidden;}
    #loginScreen::before,#loginScreen::after{content:'';position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;}
    #loginScreen::before{width:420px;height:420px;background:#D3E3FD;top:-120px;left:-100px;}
    #loginScreen::after{width:380px;height:380px;background:#FBDCE0;bottom:-140px;right:-80px;}
    .login-card{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:46px 42px;width:380px;text-align:center;position:relative;animation:fadeUp .5s ease both;}
    .login-mark{width:60px;height:60px;border-radius:18px;margin:0 auto 20px;background:linear-gradient(135deg,var(--dm),var(--space));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
    .login-mark svg{width:30px;height:30px;}
    .login-card h1{font-size:23px;font-weight:700;margin:0 0 8px;}
    .login-card p{color:var(--text-dim);font-size:14px;margin:0 0 26px;line-height:1.7;}
    #gsiButtonHolder{display:flex;justify-content:center;}
    .login-feats{display:flex;justify-content:center;gap:16px;margin-top:26px;padding-top:20px;border-top:1px solid var(--border-soft);}
    .login-feats span{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
    .login-feats i{width:7px;height:7px;border-radius:50%;background:var(--dm);display:inline-block;}

    /* ---------- App shell ---------- */
    #app{display:none;height:100%;flex-direction:column;}
    #app.ready{display:flex;}
    header.topbar{height:60px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--border);background:#fff;z-index:20;}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap;}
    .brand-mark{width:32px;height:32px;border-radius:9px;flex:none;background:linear-gradient(135deg,var(--dm),var(--space));display:flex;align-items:center;justify-content:center;}
    .brand-mark svg{width:18px;height:18px;}
    .search-wrap{flex:1;max-width:520px;position:relative;}
    .search-wrap svg{position:absolute;top:50%;right:14px;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;}
    .search-wrap input{width:100%;height:40px;border-radius:20px;border:1px solid var(--border);background:var(--panel);padding:0 42px 0 16px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s,background .15s,box-shadow .15s;}
    .search-wrap input:focus{background:#fff;border-color:var(--dm);box-shadow:0 0 0 3px var(--dm-soft);}
    .me-avatar{width:36px;height:36px;border-radius:50%;flex:none;cursor:pointer;object-fit:cover;border:2px solid transparent;transition:box-shadow .15s;}
    .me-avatar:hover{box-shadow:0 0 0 3px var(--dm-soft);}
    .me-menu-wrap{position:relative;}
    .me-menu{position:absolute;left:0;top:46px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:250px;display:none;overflow:hidden;z-index:200;animation:popIn .14s ease both;}
    .me-menu.open{display:block;}
    .me-menu .who{padding:14px 16px;border-bottom:1px solid var(--border-soft);}
    .me-menu .who b{display:block;font-size:14px;}
    .me-menu .who span{font-size:12px;color:var(--text-dim);}
    .me-menu .mi{display:flex;width:100%;align-items:center;gap:10px;background:none;border:none;padding:11px 16px;font-size:13.5px;cursor:pointer;color:var(--text);text-align:right;}
    .me-menu .mi svg{color:var(--gicon);flex:none;}
    .me-menu .mi:hover{background:var(--hover);}
    .me-menu .mi .sw{margin-inline-start:auto;}
    .me-menu .mi.danger{color:var(--danger);}
    .me-menu .mi.danger svg{color:var(--danger);}
    .switch{position:relative;width:34px;height:20px;border-radius:10px;background:#CBD2DA;transition:background .15s;flex:none;}
    .switch::after{content:'';position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
    .switch.on{background:var(--dm);}
    .switch.on::after{transform:translateX(-14px);}
    .status-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;}
    .status-dot.away{background:#F9AB00;}

    .body-row{flex:1;display:flex;min-height:0;}

    /* ---------- Sidebar ---------- */
    aside.sidebar{width:320px;flex:none;background:#FBFCFE;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:10px 10px 24px;}
    .new-chat-btn{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;margin:2px 2px 12px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,background .15s;width:fit-content;}
    .new-chat-btn:hover{background:var(--hover);box-shadow:var(--shadow);}
    .new-chat-btn svg{color:var(--dm);}
    .chips-row{display:flex;gap:6px;padding:0 2px 10px;flex-wrap:wrap;}
    .chip-btn{border:1px solid var(--border);background:#fff;border-radius:16px;padding:5px 12px;font-size:12.5px;color:var(--text-dim);cursor:pointer;transition:all .13s;}
    .chip-btn:hover{background:var(--hover);}
    .chip-btn.active{background:var(--dm-bg);border-color:var(--dm-bg);color:var(--dm);font-weight:600;}
    .nav-home{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;color:var(--text);margin-bottom:6px;}
    .nav-home svg{color:var(--text-dim);flex:none;}
    .nav-home:hover{background:var(--hover);}
    .nav-home.active{background:var(--dm-bg);color:var(--dm);}
    .nav-home.active svg{color:var(--dm);}
    .section{margin-top:6px;}
    .section-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 5px;color:var(--text-dim);font-size:12px;font-weight:600;letter-spacing:.2px;border-radius:8px;cursor:pointer;user-select:none;}
    .section-head:hover{background:var(--hover);}
    .section-head .sh-right{display:flex;align-items:center;gap:4px;}
    .section-head .sec-arrow{transition:transform .15s;display:flex;}
    .section.collapsed .sec-arrow{transform:rotate(90deg);}
    .section.collapsed .section-list{display:none;}
    .section-head button{width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .section-head button:hover{background:#E2E6EC;color:var(--text);}
    .conv-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;position:relative;transition:background .12s;animation:fadeUp .18s ease both;}
    .conv-item:hover{background:var(--hover);}
    .conv-item.active{background:var(--dm-bg);}
    .conv-item.active .conv-name{color:var(--dm);}
    .conv-avatar{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;object-fit:cover;}
    .conv-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
    .conv-meta{flex:1;min-width:0;}
    .conv-top-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
    .conv-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .conv-time{font-size:11px;color:var(--text-faint);flex:none;}
    .conv-preview{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .conv-item.unread .conv-name{font-weight:700;}
    .conv-item.unread .conv-preview{color:var(--text);font-weight:500;}
    .unread-dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--dm);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
    .conv-kebab{width:26px;height:26px;border:none;border-radius:50%;background:transparent;color:var(--text-faint);cursor:pointer;display:none;align-items:center;justify-content:center;flex:none;}
    .conv-item:hover .conv-kebab{display:flex;}
    .conv-kebab:hover{background:#E2E6EC;color:var(--text);}
    .pin-flag{position:absolute;top:8px;inset-inline-end:8px;font-size:10px;}
    .empty-hint{padding:10px 12px;font-size:12.5px;color:var(--text-faint);line-height:1.6;}
    .skeleton{height:52px;border-radius:12px;margin:4px 2px;background:linear-gradient(90deg,#EEF1F5 25%,#F7F9FB 50%,#EEF1F5 75%);background-size:200% 100%;animation:sh 1.2s infinite;}
    @keyframes sh{from{background-position:200% 0;}to{background-position:-200% 0;}}

    /* ---------- Main ---------- */
    main.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;position:relative;}
    .home-view{flex:1;overflow-y:auto;padding:28px 34px;}
    .home-greet h2{font-size:22px;margin:0 0 2px;}
    .home-greet p{color:var(--text-dim);font-size:14px;margin:0 0 16px;}
    .home-chips{display:flex;gap:8px;margin-bottom:18px;}
    .home-list .conv-item{padding:12px;}
    .home-list .conv-avatar{width:46px;height:46px;font-size:16px;}
    .home-list .conv-name{font-size:14.5px;}
    .home-list .conv-preview{font-size:13px;}
    .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);gap:14px;padding:20px;text-align:center;}
    .empty-state svg{color:#D6DAE2;}
    .empty-state h3{margin:0;color:var(--text);font-size:16px;}
    .empty-state p{margin:0;font-size:13.5px;max-width:300px;line-height:1.6;}

    /* ---------- Chat header ---------- */
    .chat-header{height:64px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);background:#fff;}
    #backBtn{display:none;background:none;border:none;cursor:pointer;color:var(--text-dim);}
    .icon-pill-group{display:flex;align-items:center;gap:4px;background:var(--gchip);border-radius:22px;padding:4px;}
    .icon-btn{width:34px;height:34px;border:none;background:transparent;border-radius:50%;color:var(--gicon);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .12s,transform .08s;}
    .icon-btn:hover{background:rgba(0,0,0,.07);}
    .icon-btn:active{transform:scale(.92);}
    .icon-btn.on{background:var(--dm-bg);color:var(--dm);}
    .chat-header .header-spacer{flex:1;}
    .chat-header .who{display:flex;align-items:center;gap:10px;min-width:0;}
    .chat-header .conv-avatar{width:34px;height:34px;font-size:13px;}
    .chat-header .titles{min-width:0;cursor:pointer;}
    .chat-header .titles b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .chat-header .titles span{font-size:11.5px;color:var(--text-dim);}
    .chat-header .chevron{color:var(--gicon);display:flex;}

    /* ---------- Messages ---------- */
    .messages{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;background:#fff;}
    #app[data-density="compact"] .messages{padding:10px 20px;}
    .empty-msgs{margin:auto;color:var(--text-faint);font-size:13px;}
    .day-sep{align-self:center;font-size:11.5px;color:var(--text-dim);background:var(--panel);border:1px solid var(--border-soft);padding:4px 14px;border-radius:14px;margin:16px 0 10px;}
    .msg-group-head{display:flex;align-items:baseline;gap:6px;margin:14px 2px 4px;font-size:11.5px;color:var(--text-faint);}
    .msg-group-head.own{align-self:flex-end;}
    .msg-group-head.other{align-self:flex-start;}
    .msg-group-head .g-name{font-weight:600;color:var(--text-dim);}
    .msg-row{display:flex;align-items:flex-end;gap:8px;max-width:66%;margin:1.5px 0;position:relative;animation:popIn .16s ease both;}
    .msg-row.own{align-self:flex-end;}
    .msg-row.other{align-self:flex-start;}
    .msg-avatar{width:28px;height:28px;border-radius:50%;flex:none;font-size:11px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center;}
    .msg-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
    .msg-avatar.spacer{visibility:hidden;}
    .msg-bubble{padding:9px 14px;border-radius:18px;font-size:14px;line-height:1.55;position:relative;word-break:break-word;white-space:pre-wrap;color:var(--bubble-text);}
    #app[data-density="compact"] .msg-bubble{padding:6px 12px;font-size:13.5px;}
    .msg-row.own .msg-bubble{background:var(--bubble-own);border-bottom-right-radius:5px;}
    .msg-row.other .msg-bubble{background:var(--bubble-other);border-bottom-left-radius:5px;}
    .msg-row.pending .msg-bubble{opacity:.55;}
    .msg-row.flash{animation:flashBg 1.2s ease both;border-radius:12px;}
    .msg-bubble a{color:var(--dm);text-decoration:underline;}
    .msg-bubble code{background:rgba(0,0,0,.07);border-radius:5px;padding:1px 5px;font-size:12.5px;direction:ltr;unicode-bidi:embed;}
    .msg-img{max-width:260px;max-height:220px;border-radius:12px;display:block;cursor:zoom-in;margin:2px 0;}
    .file-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:5px 10px;font-size:13px;direction:rtl;}
    .msg-actions{position:absolute;top:-16px;inset-inline-start:6px;display:none;gap:2px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:2px;box-shadow:var(--shadow-sm);z-index:5;}
    .msg-row:hover .msg-actions{display:flex;}
    .msg-actions button{width:26px;height:26px;border:none;background:none;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--gicon);}
    .msg-actions button:hover{background:var(--hover);}
    .react-row{display:flex;gap:4px;margin:3px 34px 2px;flex-wrap:wrap;}
    .react-row.own{margin-inline-start:0;margin-inline-end:8px;}
    .react-chip{border:1px solid var(--border);background:#fff;border-radius:12px;padding:2px 8px;font-size:12px;cursor:pointer;}
    .react-chip.mine{background:var(--dm-bg);border-color:var(--dm-bg);}

    /* ---------- Slide-over panel ---------- */
    .side-panel{position:absolute;top:0;bottom:0;left:0;width:330px;max-width:88%;background:#fff;border-right:1px solid var(--border);box-shadow:var(--shadow);z-index:60;display:none;flex-direction:column;animation:panelIn .18s ease both;}
    @keyframes panelIn{from{transform:translateX(-24px);opacity:0;}to{transform:none;opacity:1;}}
    .side-panel.open{display:flex;}
    .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-soft);}
    .panel-head b{font-size:14.5px;}
    .panel-body{flex:1;overflow-y:auto;padding:12px;}
    .panel-item{display:flex;gap:10px;padding:10px;border-radius:12px;cursor:pointer;align-items:flex-start;}
    .panel-item:hover{background:var(--hover);}
    .panel-item .pi-txt{flex:1;min-width:0;font-size:13px;line-height:1.5;}
    .panel-item .pi-txt small{display:block;color:var(--text-faint);font-size:11px;margin-top:2px;}
    .panel-item .pi-txt b{font-size:12.5px;}
    .panel-item img.pi-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;}
    .panel-item .pi-unpin{border:none;background:none;color:var(--text-faint);cursor:pointer;border-radius:8px;width:26px;height:26px;flex:none;}
    .panel-item .pi-unpin:hover{background:#FCE8E6;color:var(--danger);}
    .panel-search{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13.5px;outline:none;margin-bottom:8px;}
    .panel-search:focus{border-color:var(--dm);}
    .day-chip{display:block;width:100%;text-align:right;border:1px solid var(--border);background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:13.5px;cursor:pointer;}
    .day-chip:hover{background:var(--hover);}
    .info-rows{display:flex;flex-direction:column;gap:2px;}
    .info-row{display:flex;justify-content:space-between;padding:11px 6px;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
    .info-row span{color:var(--text-dim);}
    .big-img{max-width:100%;border-radius:12px;}

    /* ---------- Composer ---------- */
    .composer{flex:none;border-top:1px solid var(--border);padding:10px 16px 14px;display:flex;align-items:center;gap:8px;background:#fff;position:relative;}
    .composer-bar{flex:1;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:26px;padding:5px 8px;min-height:46px;transition:border-color .15s,box-shadow .15s;}
    .composer-bar:focus-within{border-color:var(--dm);box-shadow:0 0 0 3px var(--dm-soft);background:#fff;}
    .composer-bar .divider{width:1px;height:22px;background:var(--border);margin:0 4px;flex:none;}
    .composer textarea{flex:1;resize:none;border:none;background:transparent;padding:8px 6px;font-size:14px;max-height:120px;outline:none;line-height:1.4;min-width:0;}
    .format-bar{position:absolute;bottom:calc(100% + 6px);inset-inline-start:60px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);display:none;padding:6px;gap:2px;z-index:70;}
    .format-bar.open{display:flex;}
    .format-bar button{width:34px;height:34px;border:none;background:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;color:var(--text-dim);}
    .format-bar button:hover{background:var(--hover);}
    .format-bar button b{font-weight:800;} .format-bar button i{font-style:italic;} .format-bar button s{text-decoration:line-through;} .format-bar button code{font-family:monospace;font-size:13px;}
    .rec-bar{flex:1;display:none;align-items:center;gap:12px;background:#FCE8E6;border:1px solid #F6C9C5;border-radius:26px;padding:10px 16px;min-height:46px;}
    .rec-bar.on{display:flex;}
    .rec-bar .rec-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;}
    .rec-bar .rec-time{font-size:14px;font-weight:600;color:var(--danger);font-variant-numeric:tabular-nums;}
    .rec-bar .grow{flex:1;}
    .rec-bar button{border:none;background:#fff;border-radius:16px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;}
    .rec-bar button.send{background:var(--danger);color:#fff;}
    .send-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--dm);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:opacity .15s,transform .1s;box-shadow:var(--shadow-sm);}
    .send-btn:disabled{opacity:.35;cursor:default;}
    .send-btn:not(:disabled):hover{opacity:.9;}
    .send-btn:not(:disabled):active{transform:scale(.94);}
    .emoji-pop{position:fixed;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:none;z-index:210;width:296px;animation:popIn .14s ease both;}
    .emoji-pop.open{display:block;}
    .emoji-tabs{display:flex;gap:4px;margin-bottom:8px;}
    .emoji-tabs button{flex:1;border:none;background:none;border-radius:8px;padding:5px;cursor:pointer;font-size:15px;}
    .emoji-tabs button.active{background:var(--dm-bg);}
    .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:180px;overflow-y:auto;}
    .emoji-grid button{border:none;background:none;font-size:19px;border-radius:8px;cursor:pointer;padding:4px 0;}
    .emoji-grid button:hover{background:var(--hover);}

    /* ---------- Menus / popover ---------- */
    .ctx-menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);min-width:250px;max-width:300px;padding:6px;display:none;z-index:250;animation:popIn .13s ease both;max-height:70vh;overflow-y:auto;}
    .ctx-menu.open{display:block;}
    .ctx-menu .mi{display:flex;width:100%;align-items:center;gap:11px;background:none;border:none;padding:10px 12px;font-size:13.5px;cursor:pointer;color:var(--text);text-align:right;border-radius:9px;line-height:1.4;}
    .ctx-menu .mi svg{color:var(--gicon);flex:none;}
    .ctx-menu .mi small{display:block;color:var(--text-faint);font-size:11px;font-weight:400;}
    .ctx-menu .mi:hover{background:var(--hover);}
    .ctx-menu .mi.danger{color:var(--danger);} .ctx-menu .mi.danger svg{color:var(--danger);}
    .ctx-menu .sep{height:1px;background:var(--border-soft);margin:5px 8px;}
    .ctx-menu .mi .sw{margin-inline-start:auto;}
    .ctx-menu .mi .em{font-size:17px;}

    /* ---------- Modal ---------- */
    .overlay{position:fixed;inset:0;background:rgba(20,25,40,.45);display:none;align-items:center;justify-content:center;z-index:180;}
    .overlay.open{display:flex;}
    .modal{background:#fff;border-radius:20px;width:430px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:fadeUp .2s ease both;}
    .modal-head{padding:18px 20px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;}
    .modal-head h3{margin:0;font-size:16px;}
    .modal-head button{background:none;border:none;cursor:pointer;color:var(--text-dim);padding:4px;}
    .modal-body{padding:18px 20px;overflow-y:auto;}
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
    .field input{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px;outline:none;}
    .field input:focus{border-color:var(--dm);box-shadow:0 0 0 3px var(--dm-soft);}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
    .chip{display:flex;align-items:center;gap:6px;background:var(--dm-bg);color:var(--dm);padding:5px 8px 5px 10px;border-radius:16px;font-size:12.5px;font-weight:500;animation:popIn .15s ease both;}
    .chip button{background:none;border:none;cursor:pointer;color:var(--dm);display:flex;padding:0;}
    .user-results{border:1px solid var(--border);border-radius:12px;margin-top:8px;max-height:160px;overflow-y:auto;}
    .user-result{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;}
    .user-result:hover{background:var(--hover);}
    .user-result .conv-avatar{width:30px;height:30px;font-size:12px;}
    .user-result .nm{font-size:13.5px;font-weight:500;}
    .user-result .em{font-size:11.5px;color:var(--text-dim);}
    .modal-foot{padding:16px 20px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-start;gap:10px;}
    .btn{border:none;border-radius:12px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;}
    .btn-primary{background:var(--dm);color:#fff;}
    .btn-primary:disabled{opacity:.45;cursor:default;}
    .btn-ghost{background:var(--panel);color:var(--text);}

    /* ---------- Toasts & connection ---------- */
    #toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none;}
    .toast{background:#28303B;color:#fff;border-radius:14px;padding:11px 18px;font-size:13.5px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;animation:fadeUp .2s ease both;pointer-events:auto;max-width:88vw;}
    .toast button{border:none;background:none;color:#8AB4F8;font-weight:600;cursor:pointer;font-size:13.5px;}
    #connPill{position:fixed;bottom:84px;inset-inline-start:18px;background:#28303B;color:#fff;border-radius:18px;padding:7px 14px;font-size:12.5px;display:none;align-items:center;gap:8px;z-index:90;box-shadow:var(--shadow-sm);}
    #connPill.on{display:flex;}
    #connPill i{width:8px;height:8px;border-radius:50%;background:#F9AB00;animation:pulse 1s infinite;}

    /* ---------- Popout mode ---------- */
    body.popout header.topbar,body.popout aside.sidebar{display:none;}
    #popClose{display:none;}
    body.popout #popClose{display:flex;}

    /* ---------- Responsive ---------- */
    @media (max-width:760px){
      aside.sidebar{position:absolute;inset:60px 0 0 0;width:100%;z-index:10;}
      #app.chat-open aside.sidebar{display:none;}
      #app:not(.chat-open) main.main{display:none;}
      #backBtn{display:flex;}
      .msg-row{max-width:84%;}
      .side-panel{width:100%;max-width:100%;}
      .icon-pill-group .icon-btn:nth-child(n+3){display:none;}
    }
  </style>

  const qs = 'action=' + encodeURIComponent(action) +
             '&params=' + encodeURIComponent(JSON.stringify(params || []));
  return fetch(APPS_SCRIPT_URL + '?' + qs, { method: 'GET', cache: 'no-store' })
  .then(function(res){ return res.text(); })
  .then(function(text){
    let json;
    try { json = JSON.parse(text); }
    catch(e){ throw new Error('תשובה לא תקינה מהשרת (יתכן שהכתובת שגויה או שהפריסה לא ציבורית)'); }
    if(!json || !json.ok) throw new Error((json && json.error) || 'שגיאה לא ידועה מהשרת');
    return json.data;
  });
}

/* ===================== UTIL ===================== */
function colorFor(str){
  let h = 0;
  for (let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(' ');
  return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
}
function avatarNode(name, picture){
  if(picture) return '<img src="'+escapeHtml(picture)+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
  return initials(name);
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function timeLabel(ts){
  if(!ts) return '';
  const d = new Date(ts); const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString() === y.toDateString()) return 'אתמול';
  return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
}
function dayLabel(ts){
  const d = new Date(ts); const now = new Date();
  if (d.toDateString() === now.toDateString()) return 'היום';
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString() === y.toDateString()) return 'אתמול';
  return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function relativeTimeLabel(ts){
  const diffMin = Math.floor((Date.now() - ts) / 60000);
  if (diffMin < 1) return 'עכשיו';
  if (diffMin < 60) return diffMin + ' דקות';
  const d = new Date(ts); const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString() === y.toDateString()) return 'אתמול ' + d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
}
function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}
function previewOf(text){
  const t = text || '';
  if(t.indexOf('[img:') === 0) return '📷 תמונה';
  if(t.indexOf('[🎙') === 0) return t.replace(/[\[\]]/g,'');
  return t;
}

/* Markdown-לייט: המרה בטוחה (בריחה קודם) — **מודגש** _נטוי_ ~חוצה~ `קוד` + קישורים */
function mdLite(raw){
  let t = escapeHtml(raw);
  const urls = [];
  t = t.replace(/(https?:\/\/[^\s<]+)/g, function(u){ urls.push(u); return '\x00' + (urls.length-1) + '\x00'; });
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
       .replace(/_([^_\n]+)_/g, '<i>$1</i>')
       .replace(/~([^~\n]+)~/g, '<s>$1</s>')
       .replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\x00(\d+)\x00/g, function(_, i){
    const u = urls[+i];
    return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';
  });
  return t;
}

/* ===================== TOASTS ===================== */
function toast(text, opts){
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span>'+escapeHtml(text)+'</span>';
  if(opts.action){
    const b = document.createElement('button');
    b.textContent = opts.action.label;
    b.addEventListener('click', function(){ opts.action.fn(); el.remove(); });
    el.appendChild(b);
  }
  document.getElementById('toasts').appendChild(el);
  setTimeout(function(){ el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(function(){ el.remove(); }, 320); }, opts.ms || (opts.action ? 6000 : 3200));
}

function decodeJwt(token){

  const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/'))
    .split('').map(function(c){ return '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
  return JSON.parse(json);
}
function handleCredential(resp){

/* ===================== CHAT VIEW ===================== */
function openSpace(spaceId){
  const s = SPACES.find(function(x){ return x.spaceId === spaceId; });
  if(!s) return;
  ACTIVE_SPACE = spaceId;
  const st = sState(spaceId);
  st.markedUnread = false; lsSave();

  history.replaceState(null, '', '#space=' + spaceId);
  document.getElementById('navHome').classList.remove('active');
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('messagesEl').style.display = 'flex';
  document.getElementById('composer').style.display = 'flex';
  document.getElementById('app').classList.add('chat-open');
  closePanel();

  document.getElementById('chatAvatar').style.background = colorFor(s.name||'?');
  document.getElementById('chatAvatar').innerHTML = avatarNode(s.name, s.icon);
  document.getElementById('chatTitle').textContent = s.name || 'ללא שם';
  document.getElementById('chatSubtitle').textContent = s.type === 'dm' ? 'צ׳אט אישי' : (s.memberCount + ' חברים · ' + TYPE_LABEL[s.type]);

  resetMessagesView();
  document.getElementById('messagesEl').innerHTML = '<div class="empty-msgs">טוען הודעות...</div>';
  renderSidebar();
  updateTitle();

  callApi('getMessages', [spaceId, ME.email]).then(function(msgs){
    if(ACTIVE_SPACE !== spaceId) return;
    resetMessagesView();
    MESSAGES = msgs;
    LAST_TS = msgs.length ? msgs[msgs.length-1].timestamp : Date.now();
    if(!msgs.length){
      document.getElementById('messagesEl').innerHTML = '<div class="empty-msgs">אין עדיין הודעות. שלחו את הראשונה!</div>';
    } else {
      appendMessagesToDom(msgs, true);
    }
    callApi('markRead', [spaceId, ME.email]).catch(function(){});
    refreshLists();
  }).catch(handleApiError);

  clearInterval(POLL_TIMER);
  POLL_TIMER = setInterval(pollNewMessages, 3000);
}

function pollNewMessages(){
  if(!ACTIVE_SPACE) return;
  const spaceAtRequest = ACTIVE_SPACE;
  callApi('pollMessages', [spaceAtRequest, LAST_TS]).then(function(msgs){
    connOk();
    if(ACTIVE_SPACE !== spaceAtRequest || !msgs.length) return;
    LAST_TS = Math.max(LAST_TS, msgs[msgs.length-1].timestamp);
    const fresh = [];
    msgs.forEach(function(m){
      if(RENDERED_IDS.has(m.messageId)) return;
      // פתרון התנגשות: ההודעה ששלחנו חזרה מהשרת לפני שההודעה האופטימית הוחלפה
      if(m.senderEmail && m.senderEmail.toLowerCase() === ME.email.toLowerCase()){
        const p = MESSAGES.find(function(x){ return x.pending && x.text === m.text && Math.abs(x.timestamp - m.timestamp) < 120000; });
        if(p){ replaceOptimisticMessage(p.messageId, m); return; }
      }
      if(!fresh.find(function(f){ return f.messageId === m.messageId; })) fresh.push(m);
    });
    if(!fresh.length) return;
    MESSAGES = MESSAGES.concat(fresh);
    appendMessagesToDom(fresh);
    callApi('markRead', [spaceAtRequest, ME.email]).catch(function(){});
    const s = SPACES.find(function(x){ return x.spaceId === spaceAtRequest; });
    maybeNotify(s, fresh[fresh.length-1]);
    refreshLists();
  }).catch(function(){ connBad(); });
}

function resetMessagesView(){
  RENDERED_IDS = new Set();
  GROUP_KEY = null;
  GROUP_TS = 0;
  document.getElementById('messagesEl').innerHTML = '';
}
function appendMessagesToDom(list, forceScroll){
  if(!list.length) return;
  const el = document.getElementById('messagesEl');
  const wasNearBottom = forceScroll || (el.scrollHeight - el.scrollTop - el.clientHeight < 80);
  let html = '';
  list.forEach(function(m){
    if(RENDERED_IDS.has(m.messageId)) return;
    RENDERED_IDS.add(m.messageId);
    html += messageRowHtml(m);
  });
  if(!html) return;
  const empty = el.querySelector('.empty-msgs');
  if(empty) empty.remove();
  el.insertAdjacentHTML('beforeend', html);
  if(wasNearBottom) el.scrollTop = el.scrollHeight;
}

const REACT_EMOJIS = ['👍','❤️','😂','😮','😢','🎉'];
function myReactions(mid){
  const r = SS.reactions[mid];
  return r ? Object.keys(r).filter(function(e){ return r[e]; }) : [];
}
function toggleReaction(mid, emoji){
  if(!SS.reactions[mid]) SS.reactions[mid] = {};
  SS.reactions[mid][emoji] = !SS.reactions[mid][emoji];
  lsSave();
  const row = document.querySelector('.msg-row[data-id="'+mid+'"]');
  if(row) refreshReactionRow(row, mid);
}
function refreshReactionRow(row, mid){
  let el = row.querySelector('.react-row');
  const mine = myReactions(mid);
  if(!mine.length){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement('div');
    const own = row.classList.contains('own');
    el.className = 'react-row' + (own ? ' own' : '');
    row.appendChild(el);
  }
  el.innerHTML = mine.map(function(e){ return '<button class="react-chip mine" data-react="'+e+'" title="תגובה (מקומי)">'+e+'</button>'; }).join('');
}

function messageRowHtml(m){
  let html = '';
  const day = dayLabel(m.timestamp);
  const own = m.senderEmail.toLowerCase() === ME.email.toLowerCase();
  const s = SPACES.find(function(x){ return x.spaceId === ACTIVE_SPACE; });
  const showName = !own && s && s.type !== 'dm';

  const key = day + '|' + (own ? 'me' : m.senderEmail);
  const isNewGroup = key !== GROUP_KEY || (m.timestamp - GROUP_TS) > 5 * 60000;
  if(isNewGroup){
    if(key.split('|')[0] !== (GROUP_KEY ? GROUP_KEY.split('|')[0] : null)){
      html += '<div class="day-sep" data-day="'+escapeHtml(day)+'">'+day+'</div>';
    }
    const nameHtml = showName ? '<span class="g-name">'+escapeHtml(m.senderName)+'</span>' : '';
    html += '<div class="msg-group-head '+(own?'own':'other')+'">'+nameHtml+'<span>'+relativeTimeLabel(m.timestamp)+'</span></div>';
  }
  GROUP_KEY = key;
  GROUP_TS = m.timestamp;

  html += '<div class="msg-row '+(own?'own':'other')+(m.pending?' pending':'')+'" data-id="'+m.messageId+'">';
  if(!own){
    html += '<div class="msg-avatar '+(isNewGroup?'':'spacer')+'" style="background:'+colorFor(m.senderName||'?')+'">' + (isNewGroup ? avatarNode(m.senderName, m.senderPicture) : '') + '</div>';
  }
  html += '<div class="msg-bubble" title="'+new Date(m.timestamp).toLocaleString('he-IL')+'">'+renderContent(m)+'</div>';
  if(!m.pending){
    html += '<div class="msg-actions">' +
      '<button data-act="react" title="הוספת תגובה">😊</button>' +
      '<button data-act="pin" title="הצמדת הודעה">📌</button>' +
      '<button data-act="copy" title="העתקת טקסט"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></button>' +
    '</div>';
  }
  html += '</div>';
  return html;
}
function renderContent(m){
  const t = m.text || '';
  if(t.indexOf('[img:') === 0 && t.lastIndexOf(']') > 5){
    const data = t.slice(5, t.lastIndexOf(']'));
    if(/^data:image\/(png|jpe?g|gif|webp);base64,/.test(data)){
      return '<img class="msg-img" alt="תמונה" src="'+data+'">';
    }
  }
  if(t.indexOf('[🎙') === 0 && MEDIA[m.messageId]){
    return '<audio controls src="'+MEDIA[m.messageId]+'" style="max-width:240px;"></audio>';
  }
  if(t.indexOf('[קובץ:') === 0 && t.lastIndexOf(']') > 5){
    return '<span class="file-chip">📄 '+escapeHtml(t.slice(6, t.lastIndexOf(']')))+'</span>';
  }
  return mdLite(t);
}

/* פעולות ריחוף על הודעות */
document.getElementById('messagesEl').addEventListener('click', function(e){
  const img = e.target.closest('.msg-img');
  if(img){
    openPanel('תמונה', '<img class="big-img" src="'+img.src+'">');
    return;
  }
  const actBtn = e.target.closest('.msg-actions button');
  if(actBtn){
    const mid = actBtn.closest('.msg-row').dataset.id;
    const m = MESSAGES.find(function(x){ return x.messageId === mid; });
    const act = actBtn.dataset.act;
    if(act === 'react'){
      openMenu(actBtn, REACT_EMOJIS.map(function(em){
        return { emoji: em, label: (myReactions(mid).indexOf(em) !== -1 ? 'הסרת ' : 'הוספת ') + em, fn:function(){ toggleReaction(mid, em); } };
      }));
    } else if(act === 'pin'){
      toggleMsgPin(mid);
    } else if(act === 'copy'){
      const txt = m ? m.text : '';
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ toast('הטקסט הועתק'); }, function(){ fallbackCopy(txt); });
      else fallbackCopy(txt);
    }
    return;
  }
  const chip = e.target.closest('.react-chip');
  if(chip){
    toggleReaction(chip.closest('.msg-row').dataset.id, chip.dataset.react);
  }
});
function toggleMsgPin(mid){
  const arr = SS.pinnedMsgs[ACTIVE_SPACE] || [];
  const i = arr.indexOf(mid);
  if(i === -1){ arr.push(mid); toast('ההודעה הוצמדה'); }
  else { arr.splice(i, 1); toast('ההצמדה בוטלה'); }
  SS.pinnedMsgs[ACTIVE_SPACE] = arr;
  lsSave();
}

function replaceOptimisticMessage(tempId, saved){
  const idx = MESSAGES.findIndex(function(m){ return m.messageId === tempId; });
  if(idx !== -1) MESSAGES[idx] = saved;
  RENDERED_IDS.delete(tempId);
  RENDERED_IDS.add(saved.messageId);
  if(MEDIA[tempId]){ MEDIA[saved.messageId] = MEDIA[tempId]; delete MEDIA[tempId]; }
  const node = document.querySelector('.msg-row[data-id="'+tempId+'"]');
  if(node){
    node.setAttribute('data-id', saved.messageId);
    node.classList.remove('pending');
    const acts = node.querySelector('.msg-actions');
    if(!acts){
      const d = document.createElement('div');
      d.className = 'msg-actions';
      d.innerHTML = '<button data-act="react" title="הוספת תגובה">😊</button><button data-act="pin" title="הצמדת הודעה">📌</button><button data-act="copy" title="העתקת טקסט">⧉</button>';
      node.appendChild(d);
    }
  }
}
function removeOptimisticMessage(tempId){
  const idx = MESSAGES.findIndex(function(m){ return m.messageId === tempId; });
  if(idx !== -1) MESSAGES.splice(idx, 1);
  RENDERED_IDS.delete(tempId);
  const node = document.querySelector('.msg-row[data-id="'+tempId+'"]');
  if(node) node.remove();
}

/* ===================== SENDING ===================== */
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
msgInput.addEventListener('input', function(){
  sendBtn.disabled = !msgInput.value.trim();
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});
msgInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', function(){ sendMessage(); });

function sendMessage(overrideText){
  const text = (overrideText !== undefined ? overrideText : msgInput.value).trim();
  if(!text || !ACTIVE_SPACE) return;
  if(overrideText === undefined){
    msgInput.value = '';
    msgInput.style.height = 'auto';
  }
  sendBtn.disabled = !msgInput.value.trim();

  const tempId = 'temp-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  const optimistic = { messageId:tempId, spaceId:ACTIVE_SPACE, senderEmail:ME.email, senderName:ME.name, senderPicture:ME.picture, text:text, timestamp:Date.now(), pending:true };
  MESSAGES.push(optimistic);
  appendMessagesToDom([optimistic], true);
  const spaceAtSend = ACTIVE_SPACE;

  callApi('sendMessage', [{ spaceId:ACTIVE_SPACE, senderEmail:ME.email, senderName:ME.name, senderPicture:ME.picture, text:text }]).then(function(saved){
    const idx = MESSAGES.findIndex(function(m){ return m.messageId === tempId; });
    if(idx !== -1) MESSAGES[idx] = saved;
    if(ACTIVE_SPACE === spaceAtSend){
      LAST_TS = Math.max(LAST_TS, saved.timestamp);
      replaceOptimisticMessage(tempId, saved);
    }
    refreshLists();
  }).catch(function(err){
    handleApiError(err);
    if(ACTIVE_SPACE === spaceAtSend) removeOptimisticMessage(tempId);
    else {
      const idx = MESSAGES.findIndex(function(m){ return m.messageId === tempId; });
      if(idx !== -1) MESSAGES.splice(idx, 1);
    }
  });
}

document.querySelectorAll('#formatBar button').forEach(function(b){

});
function applyWrap(marker){
  const s = msgInput.selectionStart, e = msgInput.selectionEnd;
  const val = msgInput.value;
  const sel = val.slice(s, e) || 'טקסט';
  const before = val.slice(Math.max(0, s - marker.length), s);
  const after = val.slice(e, e + marker.length);
  if(before === marker && after === marker){
    msgInput.setRangeText(sel, s - marker.length, e + marker.length, 'end');
  } else {
    msgInput.setRangeText(marker + sel + marker, s, e, 'end');
  }
  msgInput.focus();
  msgInput.dispatchEvent(new Event('input'));
}

/* תמונות — מוקטנות ונשלחות בתוך ההודעה (חוצה משתמשים) */
document.getElementById('imgBtn').addEventListener('click', function(){
  if(!ACTIVE_SPACE){ toast('פתח/י שיחה כדי לשלוח תמונה'); return; }
  document.getElementById('imgInput').click();
});
document.getElementById('imgInput').addEventListener('change', function(){
  const f = this.files[0];
  this.value = '';
  if(f) processImageFile(f);
});
function processImageFile(file){
  const img = new Image();
  img.onload = function(){
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    let out = null;
    const sizes = [900, 640, 480, 380, 300, 240, 200, 160, 128];
    const qs = [0.85, 0.7, 0.55, 0.4, 0.3];
    for(const size of sizes){
      const scale = Math.min(1, size / Math.max(img.width, img.height));
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      for(const q of qs){
        const d = c.toDataURL('image/jpeg', q);
        if(d.length <= MAX_IMG_CHARS){ out = d; break; }
      }
      if(out) break;
    }
    if(out){ sendMessage('[img:' + out + ']'); toast('התמונה נשלחה'); }
    else toast('התמונה גדולה מדי לשליחה דרך השרת הנוכחי');
  };
  img.onerror = function(){ toast('קובץ התמונה לא נתמך'); };
  img.src = URL.createObjectURL(file);
}

/* הקלטה קולית — מתנגנת אצל השולח במכשיר זה (זמינה בסשן הנוכחי) */
let mediaStream = null, rec = null, recChunks = [], recStartAt = 0, recTick = null;
document.getElementById('micBtn').addEventListener('click', startRecording);
function startRecording(){
  if(!ACTIVE_SPACE){ toast('פתח/י שיחה כדי להקליט'); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('הקלטה לא נתמכת בדפדפן זה'); return; }
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    mediaStream = stream;
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(function(t){ return MediaRecorder.isTypeSupported(t); });
    recChunks = [];
    rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    rec.ondataavailable = function(e){ if(e.data.size) recChunks.push(e.data); };
    rec.onstop = finishRecording;
    rec.start();
    recStartAt = Date.now();
    document.getElementById('composerBar').style.display = 'none';
    document.getElementById('recBar').classList.add('on');
    recTick = setInterval(function(){
      const sec = Math.floor((Date.now() - recStartAt) / 1000);
      document.getElementById('recTime').textContent = Math.floor(sec/60) + ':' + ('0'+(sec%60)).slice(-2);
      if(sec >= 60) stopRecording(true);
    }, 250);
  }).catch(function(){ toast('אין הרשאת מיקרופון'); });
}
function stopRecording(send){
  if(rec && rec.state !== 'inactive'){
    rec._send = send;
    rec.stop();
  }
}
function finishRecording(){
  clearInterval(recTick);
  if(mediaStream){ mediaStream.getTracks().forEach(function(t){ t.stop(); }); mediaStream = null; }
  document.getElementById('composerBar').style.display = 'flex';
  document.getElementById('recBar').classList.remove('on');
  const send = rec._send !== false;
  const dur = Math.floor((Date.now() - recStartAt) / 1000);
  rec = null;
  if(!send || !recChunks.length) { toast('ההקלטה בוטלה'); return; }
  const blob = new Blob(recChunks, { type: recChunks[0].type || 'audio/webm' });
  const label = '[🎙 הודעה קולית · ' + Math.floor(dur/60) + ':' + ('0'+(dur%60)).slice(-2) + ' | מוצג במכשיר זה]';
  const tempId = 'temp-'+Date.now()+'-a';
  MEDIA[tempId] = URL.createObjectURL(blob);
  sendMessageWithId(label, tempId);
}
function sendMessageWithId(text, tempId){
  if(!ACTIVE_SPACE) return;
  const optimistic = { messageId:tempId, spaceId:ACTIVE_SPACE, senderEmail:ME.email, senderName:ME.name, senderPicture:ME.picture, text:text, timestamp:Date.now(), pending:true };
  MESSAGES.push(optimistic);
  appendMessagesToDom([optimistic], true);
  const spaceAtSend = ACTIVE_SPACE;
  callApi('sendMessage', [{ spaceId:ACTIVE_SPACE, senderEmail:ME.email, senderName:ME.name, senderPicture:ME.picture, text:text }]).then(function(saved){
    const idx = MESSAGES.findIndex(function(m){ return m.messageId === tempId; });
    if(idx !== -1) MESSAGES[idx] = saved;
    if(ACTIVE_SPACE === spaceAtSend){ LAST_TS = Math.max(LAST_TS, saved.timestamp); replaceOptimisticMessage(tempId, saved); }
    refreshLists();
  }).catch(function(err){ handleApiError(err); removeOptimisticMessage(tempId); });
}
document.getElementById('recStop').addEventListener('click', function(){ stopRecording(true); });

  window.open('https://meet.google.com/new', '_blank');
  toast('נפתחה פגישת Meet חדשה');
});
document.getElementById('btnDensity').addEventListener('click', function(){
  SS.prefs.density = SS.prefs.density === 'compact' ? 'comfortable' : 'compact';
  lsSave(); applyDensity();
  toast(SS.prefs.density === 'compact' ? 'מצב צפוף' : 'מצב נוח');
});
document.getElementById('btnChatSearch').addEventListener('click', function(){ openChatSearchPanel(); });
document.getElementById('btnPinned').addEventListener('click', function(){ openPinnedPanel(); });
document.getElementById('btnHistory').addEventListener('click', function(){ openHistoryPanel(); });
document.getElementById('btnFiles').addEventListener('click', function(){ openFilesPanel(); });
document.getElementById('btnKebab').addEventListener('click', function(e){ e.stopPropagation(); openSpaceMenu(this); });
document.getElementById('chatTitles').addEventListener('click', function(){ openSpaceMenu(document.getElementById('btnKebab')); });

function openSpaceMenu(anchor){
  if(!ACTIVE_SPACE) return;
  const s = SPACES.find(function(x){ return x.spaceId === ACTIVE_SPACE; });
  const st = sState(ACTIVE_SPACE);
  openMenu(anchor, [
    { label:'פתיחה בחלון קופץ', icon:ICONS.popout, sub:'ניווט בשיחה בנפרד', fn:function(){ popoutSpace(ACTIVE_SPACE); } },
    { label:'חיפוש בצ׳אט', icon:ICONS.search, fn:function(){ openChatSearchPanel(); } },
    { sep:true },
    { label:'מוצמדות', icon:ICONS.pin, sub:(SS.pinnedMsgs[ACTIVE_SPACE]||[]).length + ' הודעות מוצמדות', fn:function(){ openPinnedPanel(); } },
    { label:'קבצים ותמונות', icon:ICONS.files, fn:function(){ openFilesPanel(); } },
    { label:'ניווט לפי תאריך', icon:ICONS.history, fn:function(){ openHistoryPanel(); } },
    { sep:true },
    { label: st.pinned ? 'ביטול הצמדת שיחה' : 'הצמדת שיחה', icon:ICONS.pin, fn:function(){ togglePin(ACTIVE_SPACE); } },
    { label: st.starred ? 'הסרת כוכב' : 'סימון בכוכב', icon:ICONS.star, fn:function(){ toggleStar(ACTIVE_SPACE); } },
    { label:'סימון כלא נקרא', icon:ICONS.markUnread, fn:function(){ toggleMarkUnread(ACTIVE_SPACE); } },
    { label:'השתקת התראות', icon:ICONS.mute, switchOn:!!st.muted, fn:function(){ toggleMute(ACTIVE_SPACE); } },
    { label:'הסתרת השיחה מהרשימה', icon:ICONS.hide, fn:function(){ hideSpace(ACTIVE_SPACE); } },
    { sep:true },
    { label:'התראות מיידיות', icon:ICONS.bell, switchOn:!!(SS.prefs.notif && !st.muted), fn:function(){
        if(st.muted){ toggleMute(ACTIVE_SPACE); return; }
        document.getElementById('meMenu').classList.add('open');
        document.querySelector('#meMenu .mi[data-mact="notif"]').click();
      } },
    { label:'העתקת קישור למרחב המשותף', icon:ICONS.link, fn:function(){ copySpaceLink(ACTIVE_SPACE); } },
    { label:'מידע על השיחה', icon:ICONS.info, fn:function(){ openInfoPanel(s); } }
  ]);
}
function openInfoPanel(s){
  const st = SS.spaces[s.spaceId] || {};
  openPanel('מידע על השיחה', '<div class="info-rows">' +
    '<div class="info-row"><span>שם</span><b>'+escapeHtml(s.name||'ללא שם')+'</b></div>' +
    '<div class="info-row"><span>סוג</span><b>'+TYPE_LABEL[s.type]+'</b></div>' +
    '<div class="info-row"><span>חברים</span><b>'+ (s.memberCount || 1) +'</b></div>' +
    '<div class="info-row"><span>מוצמדת</span><b>'+(st.pinned?'כן':'לא')+'</b></div>' +
    '<div class="info-row"><span>מושתקת</span><b>'+(st.muted?'כן':'לא')+'</b></div>' +
    '<div class="info-row"><span>הודעות נטענות</span><b>'+MESSAGES.length+'</b></div>' +
  '</div>');
}

/* ===================== SIDE PANEL ===================== */
function openPanel(title, bodyHtml){
  document.getElementById('panelTitle').textContent = title;
  const b = document.getElementById('panelBody');
  if(typeof bodyHtml === 'string') b.innerHTML = bodyHtml;
  else { b.innerHTML = ''; b.appendChild(bodyHtml); }
  document.getElementById('sidePanel').classList.add('open');
}
function closePanel(){ document.getElementById('sidePanel').classList.remove('open'); }
document.getElementById('panelClose').addEventListener('click', closePanel);

function jumpToMsg(mid){
  const el = document.querySelector('.msg-row[data-id="'+mid+'"]');
  if(!el){ toast('ההודעה לא נטענה בתצוגה הנוכחית'); return; }
  el.scrollIntoView({ block:'center', behavior:'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function jumpToDay(day){
  const el = document.querySelector('.day-sep[data-day="'+day.replace(/"/g,'')+'"]');
  if(!el){ toast('התאריך לא נטען בתצוגה'); return; }
  el.scrollIntoView({ block:'start', behavior:'smooth' });
}

function openPinnedPanel(){
  if(!ACTIVE_SPACE) return;
  const ids = SS.pinnedMsgs[ACTIVE_SPACE] || [];
  if(!ids.length){ openPanel('הודעות מוצמדות', '<div class="empty-msgs" style="padding:30px 0;text-align:center;color:var(--text-faint);">אין הודעות מוצמדות.<br>רחפו על הודעה ולחצו 📌 כדי להצמיד.</div>'); return; }
  const html = ids.map(function(mid){
    const m = MESSAGES.find(function(x){ return x.messageId === mid; });
    if(!m) return '';
    return '<div class="panel-item" data-jump="'+mid+'">' +
      '<div class="conv-avatar" style="width:30px;height:30px;font-size:12px;background:'+colorFor(m.senderName||'?')+'">'+avatarNode(m.senderName, m.senderPicture)+'</div>' +
      '<div class="pi-txt"><b>'+escapeHtml(m.senderName)+'</b> '+previewOf(m.text).slice(0,120)+'<small>'+relativeTimeLabel(m.timestamp)+'</small></div>' +
      '<button class="pi-unpin" data-unpin="'+mid+'" title="ביטול הצמדה">✕</button>' +
    '</div>';
  }).join('');
  openPanel('הודעות מוצמדות', html || '<div class="empty-msgs">ההודעות המוצמדות לא נטענו</div>');
  document.getElementById('panelBody').querySelectorAll('[data-unpin]').forEach(function(b){
    b.addEventListener('click', function(e){ e.stopPropagation(); toggleMsgPin(b.dataset.unpin); openPinnedPanel(); });
  });
  bindJumpItems();
}
function openHistoryPanel(){
  if(!ACTIVE_SPACE) return;
  const days = [];
  MESSAGES.forEach(function(m){ const d = dayLabel(m.timestamp); if(days.indexOf(d) === -1) days.push(d); });
  if(!days.length){ openPanel('ניווט לפי תאריך', '<div class="empty-msgs" style="padding:30px;text-align:center;color:var(--text-faint);">אין הודעות טעונות</div>'); return; }
  const html = days.map(function(d){ return '<button class="day-chip" data-day="'+escapeHtml(d)+'">📅 '+d+'</button>'; }).join('') +
    '<button class="day-chip" id="jumpTop">⏫ קפיצה לתחילת השיחה</button>';
  openPanel('ניווט לפי תאריך', html);
  document.getElementById('panelBody').querySelectorAll('[data-day]').forEach(function(b){
    b.addEventListener('click', function(){ jumpToDay(b.dataset.day); closePanel(); });
  });
  const jt = document.getElementById('jumpTop');
  if(jt) jt.addEventListener('click', function(){ document.getElementById('messagesEl').scrollTop = 0; closePanel(); });
}
function openFilesPanel(){
  if(!ACTIVE_SPACE) return;
  const items = [];
  MESSAGES.forEach(function(m){
    const t = m.text || '';
    let thumb = '', txt = '';
    if(t.indexOf('[img:') === 0){
      const data = t.slice(5, t.lastIndexOf(']'));
      if(/^data:image/.test(data)){ thumb = '<img class="pi-thumb" src="'+data+'">'; txt = '📷 תמונה'; }
    } else if(t.indexOf('[🎙') === 0){ txt = escapeHtml(t.replace(/[\[\]]/g,'')); }
    else if(t.indexOf('[קובץ:') === 0){ txt = '📄 ' + escapeHtml(t.slice(6, t.lastIndexOf(']'))); }
    if(txt) items.push('<div class="panel-item" data-jump="'+m.messageId+'">' + (thumb||'') +
      '<div class="pi-txt"><b>'+escapeHtml(m.senderName)+'</b> '+txt+'<small>'+relativeTimeLabel(m.timestamp)+'</small></div></div>');
  });
  openPanel('קבצים ותמונות', items.length ? items.join('') : '<div class="empty-msgs" style="padding:30px;text-align:center;color:var(--text-faint);">לא נמצאו קבצים או תמונות בהודעות שנטענו</div>');
  bindJumpItems();
}
function openChatSearchPanel(){
  if(!ACTIVE_SPACE) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = '<input class="panel-search" id="chatSearchInput" placeholder="חיפוש בהודעות שנטענו…"><div id="chatSearchResults"></div>';
  openPanel('חיפוש בצ׳אט', wrap);
  const inp = wrap.querySelector('#chatSearchInput');
  const res = wrap.querySelector('#chatSearchResults');
  function doSearch(){
    const q = inp.value.trim().toLowerCase();
    SEARCH_Q = q;
    if(!q){ res.innerHTML = ''; return; }
    const hits = MESSAGES.filter(function(m){ return (m.text||'').toLowerCase().indexOf(q) !== -1; }).slice(-50).reverse();
    res.innerHTML = hits.length ? hits.map(function(m){
      const t = previewOf(m.text);
      const i = t.toLowerCase().indexOf(q);
      const snippet = escapeHtml(t.slice(Math.max(0, i-30), i+60));
      return '<div class="panel-item" data-jump="'+m.messageId+'">' +
        '<div class="conv-avatar" style="width:30px;height:30px;font-size:12px;background:'+colorFor(m.senderName||'?')+'">'+avatarNode(m.senderName, m.senderPicture)+'</div>' +
        '<div class="pi-txt"><b>'+escapeHtml(m.senderName)+'</b> …'+snippet+'…<small>'+relativeTimeLabel(m.timestamp)+'</small></div></div>';
    }).join('') : '<div class="empty-msgs" style="padding:24px;text-align:center;color:var(--text-faint);">לא נמצאו תוצאות</div>';
    bindJumpItems();
  }
  inp.addEventListener('input', doSearch);
  setTimeout(function(){ inp.focus(); }, 60);
}
function bindJumpItems(){
  document.getElementById('panelBody').querySelectorAll('[data-jump]').forEach(function(n){
    n.addEventListener('click', function(){ jumpToMsg(n.dataset.jump); });
  });
}

/* ===================== SEARCH (topbar) ===================== */
document.getElementById('searchInput').addEventListener('input', function(e){
  const q = e.target.value.trim().toLowerCase();
  SEARCH_Q = q;
  document.querySelectorAll('.conv-item').forEach(function(node){
    const nameEl = node.querySelector('.conv-name');
    const name = nameEl ? nameEl.textContent.toLowerCase() : '';
    node.style.display = (!q || name.indexOf(q) !== -1) ? 'flex' : 'none';
  });
});

/* ===================== NEW CHAT MENU + MODAL ===================== */
document.getElementById('newChatBtn').addEventListener('click', function(e){
  e.stopPropagation();
  openMenu(this, [
    { emoji:'💬', label:"צ'אט אישי חדש", fn:function(){ openModal('dm'); } },
    { emoji:'👥', label:'קבוצה חדשה', fn:function(){ openModal('group'); } },
    { emoji:'🌐', label:'מרחב חדש', fn:function(){ openModal('space'); } }
  ]);
});
document.querySelectorAll('.new-btn').forEach(function(btn){
  btn.addEventListener('click', function(e){ e.stopPropagation(); openModal(btn.dataset.type); });
});
function openModal(type){
  PENDING_TYPE = type;
  SELECTED_MEMBERS = [];
  document.getElementById('spaceNameInput').value = '';
  document.getElementById('spaceDescInput').value = '';
  document.getElementById('userSearchInput').value = '';
  document.getElementById('userResults').style.display = 'none';
  renderChips();
  const isDm = type === 'dm';
  document.getElementById('modalTitle').textContent = isDm ? 'צ׳אט אישי חדש' : (type === 'group' ? 'קבוצה חדשה' : 'מרחב חדש');
  document.getElementById('nameField').style.display = isDm ? 'none' : 'block';
  document.getElementById('descField').style.display = isDm ? 'none' : 'block';
  document.getElementById('membersLabel').textContent = isDm ? 'חיפוש איש קשר' : 'הוספת חברים';
  document.getElementById('createBtn').textContent = isDm ? 'פתיחת צ׳אט' : 'יצירה';
  updateCreateBtn();
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

const userSearchInput = document.getElementById('userSearchInput');
let searchDebounce;
userSearchInput.addEventListener('input', function(){
  clearTimeout(searchDebounce);
  const q = userSearchInput.value.trim();
  searchDebounce = setTimeout(function(){
    callApi('searchUsers', [q, ME.email]).then(function(users){
      const filtered = users.filter(function(u){ return !SELECTED_MEMBERS.find(function(m){ return m.email === u.email; }); });
      const el = document.getElementById('userResults');
      if(filtered.length === 0){ el.style.display = 'none'; return; }
      el.style.display = 'block';
      el.innerHTML = filtered.map(function(u){
        return '<div class="user-result" data-email="'+u.email+'" data-name="'+escapeHtml(u.name)+'" data-picture="'+escapeHtml(u.picture||'')+'">' +
          '<div class="conv-avatar" style="background:'+colorFor(u.name)+'">'+avatarNode(u.name,u.picture)+'</div>' +
          '<div><div class="nm">'+escapeHtml(u.name)+'</div><div class="em">'+escapeHtml(u.email)+'</div></div>' +
        '</div>';
      }).join('');
      el.querySelectorAll('.user-result').forEach(function(node){
        node.addEventListener('click', function(){
          if(PENDING_TYPE === 'dm'){
            SELECTED_MEMBERS = [{email:node.dataset.email, name:node.dataset.name, picture:node.dataset.picture}];
          } else if(!SELECTED_MEMBERS.find(function(m){ return m.email === node.dataset.email; })){
            SELECTED_MEMBERS.push({email:node.dataset.email, name:node.dataset.name, picture:node.dataset.picture});
          }
          userSearchInput.value = '';
          el.style.display = 'none';
          renderChips();
          updateCreateBtn();
        });
      });
    }).catch(handleApiError);
  }, 200);
});
function renderChips(){
  const el = document.getElementById('selectedChips');
  el.innerHTML = SELECTED_MEMBERS.map(function(m){
    return '<span class="chip">'+escapeHtml(m.name)+
      '<button data-email="'+m.email+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg></button></span>';
  }).join('');
  el.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      SELECTED_MEMBERS = SELECTED_MEMBERS.filter(function(m){ return m.email !== btn.dataset.email; });
      renderChips();
      updateCreateBtn();
    });
  });
}
function updateCreateBtn(){
  const nameOk = PENDING_TYPE === 'dm' || document.getElementById('spaceNameInput').value.trim().length > 0;
  document.getElementById('createBtn').disabled = SELECTED_MEMBERS.length === 0 || !nameOk;
}
document.getElementById('spaceNameInput').addEventListener('input', updateCreateBtn);
document.getElementById('createBtn').addEventListener('click', function(){
  const payload = {
    type: PENDING_TYPE,
    creatorEmail: ME.email,
    memberEmails: SELECTED_MEMBERS.map(function(m){ return m.email; }),
    name: PENDING_TYPE === 'dm' ? '' : document.getElementById('spaceNameInput').value.trim(),
    description: PENDING_TYPE === 'dm' ? '' : document.getElementById('spaceDescInput').value.trim()
  };
  document.getElementById('createBtn').disabled = true;
  callApi('createSpace', [payload]).then(function(space){
    closeModal();
    refreshListsThenOpen(space.spaceId);
  }).catch(function(err){
    handleApiError(err);
    document.getElementById('createBtn').disabled = false;
  });
});
function refreshListsThenOpen(spaceId){
  callApi('getBootstrap', [ME.email]).then(function(list){
    SPACES = list;
    renderSidebar();
    openSpace(spaceId);
  }).catch(handleApiError);
}
